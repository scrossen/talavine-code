<svg width="512" height="512" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Code Bee splash on the midnight ground (background color from MauiSplashScreen Color). -->
  <defs>
    <radialGradient id="scsp-glow">
      <stop offset="0" stop-color="#DFC383" stop-opacity="0.40"/>
      <stop offset="0.55" stop-color="#DFC383" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#DFC383" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="scsp-screen-glow">
      <stop offset="0" stop-color="#8FB4FF" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#8FB4FF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#8FB4FF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="scsp-bodyclip"><rect x="49" y="56" width="30" height="46" rx="15"/></clipPath>
  </defs>
  <circle cx="18" cy="22" r="1.3" fill="#C9D6F2" opacity="0.7"/>
  <circle cx="108" cy="18" r="1.1" fill="#C9D6F2" opacity="0.55"/>
  <circle cx="104" cy="106" r="1.3" fill="#C9D6F2" opacity="0.6"/>
  <circle cx="20" cy="98" r="1" fill="#C9D6F2" opacity="0.5"/>
  <g transform="translate(64 64) scale(1.12) translate(-64 -64)">

  <!-- code window behind the bee -->
  <ellipse cx="64" cy="44" rx="40" ry="26" fill="url(#scsp-screen-glow)"/>
  <rect x="24" y="22" width="80" height="48" rx="8" fill="#F7F5EE" fill-opacity="0.10" stroke="#C9D6F2" stroke-opacity="0.55" stroke-width="2"/>
  <path d="M24 32H104" stroke="#C9D6F2" stroke-opacity="0.35" stroke-width="1.6"/>
  <circle cx="31" cy="27" r="1.7" fill="#D95F3D"/>
  <circle cx="37" cy="27" r="1.7" fill="#E7D194"/>
  <circle cx="43" cy="27" r="1.7" fill="#9CC9A3"/>
  <!-- code lines -->
  <path d="M32 40H50" stroke="#9CC9A3" stroke-width="3" stroke-linecap="round"/>
  <path d="M55 40H74" stroke="#E7D194" stroke-width="3" stroke-linecap="round"/>
  <path d="M38 48H58" stroke="#8FB4FF" stroke-width="3" stroke-linecap="round"/>
  <path d="M63 48H86" stroke="#E7D194" stroke-width="3" stroke-linecap="round" stroke-opacity="0.8"/>
  <path d="M38 56H46" stroke="#D95F3D" stroke-width="3" stroke-linecap="round"/>
  <path d="M51 56H66" stroke="#C9D6F2" stroke-width="3" stroke-linecap="round" stroke-opacity="0.6"/>
  <!-- cursor -->
  <rect x="70" y="53.5" width="2.5" height="6" fill="#E7D194"/>

  <!-- bee glow -->
  <ellipse cx="64" cy="78" rx="34" ry="38" fill="url(#scsp-glow)"/>
  <!-- wings -->
  <ellipse cx="40" cy="70" rx="16" ry="25" fill="#F7F5EE" fill-opacity="0.30" transform="rotate(30 40 70)"/>
  <ellipse cx="88" cy="70" rx="16" ry="25" fill="#F7F5EE" fill-opacity="0.30" transform="rotate(-30 88 70)"/>
  <!-- stinger -->
  <path d="M60 100L64 112L68 100Z" fill="#DFC383"/>
  <!-- body -->
  <rect x="49" y="56" width="30" height="46" rx="15" fill="#DFC383"/>
  <g clip-path="url(#scsp-bodyclip)">
    <rect x="49" y="68" width="30" height="8" fill="#2A3B5F"/>
    <rect x="49" y="82" width="30" height="8" fill="#2A3B5F"/>
  </g>
  <!-- head -->
  <circle cx="64" cy="48" r="13" fill="#F7F5EE"/>
  <!-- coder glasses -->
  <circle cx="58.5" cy="49" r="4.6" fill="#8FB4FF" fill-opacity="0.25" stroke="#2A3B5F" stroke-width="1.8"/>
  <circle cx="69.5" cy="49" r="4.6" fill="#8FB4FF" fill-opacity="0.25" stroke="#2A3B5F" stroke-width="1.8"/>
  <path d="M63.1 49H64.9" stroke="#2A3B5F" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M53.9 48.2L51.5 47.4M74.1 48.2L76.5 47.4" stroke="#2A3B5F" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="58.5" cy="49.4" r="1.7" fill="#2A3B5F"/>
  <circle cx="69.5" cy="49.4" r="1.7" fill="#2A3B5F"/>
  <path d="M60 55.5Q64 58.5 68 55.5" stroke="#2A3B5F" stroke-width="1.8" stroke-linecap="round"/>
  <!-- antennae -->
  <path d="M58 36.5Q55 30 50 28" stroke="#DFC383" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M70 36.5Q73 30 78 28" stroke="#DFC383" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="50" cy="28" r="2.2" fill="#E7D194"/>
  <circle cx="78" cy="28" r="2.2" fill="#E7D194"/>
  </g>
</svg>
